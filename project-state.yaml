open_questions:
  - id: Q-C2-001
    stage: C2
    question: 系统最小追踪单位是电池包、模组还是单体电芯？
    impact: 影响追踪对象、编号、状态机和后续需求。
    status: resolved
    resolution: C2 基线确定首期以电池包作为最小独立追踪单位，模组和电芯只记录数量、类型或规格。
  - id: Q-C2-002
    stage: C2
    question: 电池唯一编号从哪里产生，是否通过二维码识别？
    impact: 影响接收、追溯、审计和演示方式。
    status: resolved
    resolution: C2 基线确定每个电池包具有系统内唯一追溯编码，编码可以通过二维码展示和识别。
  - id: Q-C2-003
    stage: C2
    question: 回收接收时需要登记哪些来源信息？
    impact: 影响回收接收事实和追溯节点。
    status: resolved
    resolution: C2 基线确定登记来源企业、交接日期、交接地点、关联单据和电池原始编码等信息。
  - id: Q-C2-004
    stage: C2
    question: 验收结果有哪些：通过、拒收、待处理，还是包含有条件接收？
    impact: 影响验收状态和异常路径。
    status: resolved
    resolution: C2 基线确定验收通过、待补充资料和验收不通过三类核心结果。
  - id: Q-C2-005
    stage: C2
    question: 入库前是否必须完成验收？
    impact: 影响入库条件和业务规则。
    status: resolved
    resolution: C2 基线确定只有已验收待入库或接收待入库的电池才能入库。
  - id: Q-C2-006
    stage: C2
    question: 企业间流转由哪一方创建，哪一方确认接收？
    impact: 影响流转职责和协同边界。
    status: resolved
    resolution: C2 基线确定由转出企业发起流转，由接收企业确认接收。
  - id: Q-C2-007
    stage: C2
    question: 对方拒收或实际数量不一致时如何处理？
    impact: 影响异常流程和追溯记录。
    status: resolved
    resolution: C2 基线确定编码或数量不一致时不能直接完成接收，应暂停接收并登记异常，双方确认更正或退回。
  - id: Q-C2-008
    stage: C2
    question: 综合利用包括梯次利用、拆解、材料回收中的哪些环节？
    impact: 影响综合利用范围。
    status: resolved
    resolution: C2 基线确定综合利用包括梯次利用、拆解、材料回收或其他处置的结果登记。
  - id: Q-C2-009
    stage: C2
    question: 哪些操作必须由业务主管审核？
    impact: 影响职责、权限和业务规则。
    status: resolved
    resolution: C2 基线确定流转审核、关键异常关闭、业务更正、利用结果更正和模拟报送审核等需业务主管参与。
  - id: Q-C2-010
    stage: C2
    question: 哪些记录一旦生效就不能删除，只能撤销或更正？
    impact: 影响审计、追溯和更正规则。
    status: resolved
    resolution: C2 基线确定已生效业务记录不得物理删除，更正必须保留原始记录和变更原因。
  - id: Q-C2-011
    stage: C2
    question: 合规报送首期采用报表导出还是模拟报送？
    impact: 影响合规报送定位和演示交付。
    status: resolved
    resolution: C2 基线确定首期采用文件导出和模拟报送，不连接真实监管平台。
  - id: Q-C2-012
    stage: C2
    question: 追溯查询需要展示哪些关键节点和责任主体？
    impact: 影响追溯事件口径和展示内容。
    status: resolved
    resolution: C2 基线确定追溯视图展示追溯编码、原始编码、责任企业、状态、仓库库位、来源、验收、出入库、流转、综合利用、异常、操作人员、状态变化和审计信息。
  - id: Q-C3-001
    stage: C3
    question: 电池基础信息的最终字段清单是什么？
    impact: 影响 C4 需求规格、原型字段和验收用例。
    status: deferred-to-C4
    resolution: 不阻塞 C3，后续进入 C4 需求规格和原型字段定义。
  - id: Q-C3-002
    stage: C3
    question: 验收项目及具体判定标准是什么？
    impact: 影响验收记录、验收结果说明和异常判断。
    status: deferred-to-C4
    resolution: C3 确定由人工判断，具体检测数值和行业判定阈值后移到 C4。
  - id: Q-C3-003
    stage: C3
    question: 仓库和库位编码规则是什么？
    impact: 影响入库选择、库存查询和追溯展示。
    status: deferred-to-C4
    resolution: C3 确定入库必须引用已存在且有效的仓库和库位，具体编码规则后移到 C4。
  - id: Q-C3-004
    stage: C3
    question: 是否需要上传交接凭证和检测附件？
    impact: 影响回收来源资料和资料不足分支。
    status: resolved
    resolution: 支持选填，附件缺失不阻止正常验收；待补充资料时可通过附件补充。
  - id: Q-C3-005
    stage: C3
    question: 是否需要打印二维码标签？
    impact: 影响 C4 原型和后续实现范围，但不影响 C3 业务闭环确认。
    status: resolved
    resolution: 第一切片支持展示电池追溯编码，C3 不包含二维码标签打印。
