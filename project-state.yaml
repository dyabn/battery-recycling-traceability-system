baselines:
  C1:
    name: 业务定位基线
    version: V1.0
    status: confirmed
    confirmed_date: 2026-09-16
    project_name: 面向动力电池回收利用企业的流转协同与追溯管理系统
    system_positioning: 面向动力电池回收利用企业的 PC Web 系统，支持电池从回收接收、验收入库、库存管理、企业间流转到综合利用的业务协同和全过程追溯。
    service_scope:
      primary: 以企业内部管理为主。
      secondary: 支持有限的上下游企业协同。
      excluded_positioning: 不建设国家级监管平台。
    business_value_priority:
      - 电池流转全过程留痕与追溯
      - 企业内部及企业间流转协同
      - 异常发现和业务闭环
      - 合规数据汇总与报表支撑
    course_delivery_note: 课程展示属于项目交付目标，不作为业务价值。
    in_scope:
      - 用户、企业、角色和权限管理
      - 电池及电池包基础档案
      - 回收接收与验收
      - 入库、库存和出库
      - 企业间流转及接收确认
      - 综合利用结果登记
      - 生命周期追溯
      - 异常记录与处理
      - 统计分析和系统管理
    out_of_scope:
      - 对接真实国家监管平台
      - 真实检测设备和物联网设备
      - 在线支付、财务结算和物流调度
      - 面向社会公众的查询平台
      - 复杂拆解生产线控制
      - 移动端、小程序和 App
    initial_business_roles:
      - 回收操作员
      - 仓库管理员
      - 流转管理员
      - 综合利用人员
      - 业务主管
      - 系统管理员
      - 外部协作企业
    role_boundary: 外部协作企业作为企业间流转参与方，暂不设置独立公众角色。
    core_business_objects:
      - 企业
      - 用户、角色及权限
      - 动力电池或电池包
      - 回收批次
      - 验收记录
      - 入库、库存和出库记录
      - 流转单
      - 接收确认记录
      - 综合利用记录
      - 生命周期追溯事件
      - 异常记录
      - 操作审计记录
    external_interface_positioning: 首期只保留监管报送和外部系统接口的设计扩展能力，不进行真实平台连接；课程演示可以使用模拟报送或文件导出。
    document_requirement: 按课程“软件工程27项文档”逐阶段生成；现在只确定文档清单和对应阶段，不一次性生成全部文档；如果老师提供固定名称和模板，再按课堂要求调整。
  C2:
    name: 全局业务基线
    version: V1.0
    status: confirmed
    confirmed_date: 2026-09-16
    document: docs/business/c2-global-business-baseline.md
    previous_baseline: C1 业务定位基线 V1.0
    summary:
      - 完成业务术语统一
      - 完成业务参与者及职责定义
      - 完成端到端业务主流程
      - 完成核心业务对象及关系
      - 完成电池包生命周期状态和业务单据状态
      - 完成 50 条业务规则
      - 完成 15 类主要异常及处理方式
      - 完成系统处理与人工处理边界
      - 完成追溯信息要求和统计指标定义
      - 提出第一条纵向业务切片候选
  C3:
    name: 第一条业务切片定义
    version: V1.0
    status: confirmed
    confirmed_date: 2026-09-17
    review_result: 修改后通过
    document: docs/business/c3-first-business-slice.md
    slice_name: 回收接收 -> 电池登记 -> 验收 -> 入库 -> 库存可见
    summary:
      - 明确系统追溯编码和原始编码判重规则
      - 明确回收批次与单个电池验收关系
      - 完成 11 个用例
      - 完成 14 条 Given/When/Then 验收标准
      - 完成需求、规则、状态和验收标准追踪矩阵
      - 明确 C4 后移问题

