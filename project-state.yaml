project:
  name: 面向动力电池回收利用企业的流转协同与追溯管理系统
  repository: battery-recycling-traceability-system
  application_type: pc-web
  architecture: frontend-backend-separated-monolith

lifecycle:
  current_stage: global-business-baseline
  current_gate: C2
  completed_gate: C1
  last_completed_stage: business-positioning
  baseline_version: V1.0
  status: in-progress

confirmed:
  project_topic: true
  course_constraints: true
  business_positioning: true
  global_business_baseline: false
  first_business_slice: false
  system_requirements: false
  prototype: false

baselines:
  C1:
    name: 业务定位基线
    version: V1.0
    status: confirmed
    confirmed_date: 2026-09-16
    project_name: 面向动力电池回收利用企业的流转协同与追溯管理系统
    system_positioning: 面向动力电池回收利用企业的 PC Web 系统，支持电池从回收接收、验收入库、库存管理、企业间流转到综合利用的业务协同和全过程追溯。
    service_scope:
      primary: 以企业内部管理为主。
      secondary: 支持有限的上下游企业协同。
      excluded_positioning: 不建设国家级监管平台。
    business_value_priority:
      - 电池流转全过程留痕与追溯
      - 企业内部及企业间流转协同
      - 异常发现和业务闭环
      - 合规数据汇总与报表支撑
    course_delivery_note: 课程展示属于项目交付目标，不作为业务价值。
    in_scope:
      - 用户、企业、角色和权限管理
      - 电池及电池包基础档案
      - 回收接收与验收
      - 入库、库存和出库
      - 企业间流转及接收确认
      - 综合利用结果登记
      - 生命周期追溯
      - 异常记录与处理
      - 统计分析和系统管理
    out_of_scope:
      - 对接真实国家监管平台
      - 真实检测设备和物联网设备
      - 在线支付、财务结算和物流调度
      - 面向社会公众的查询平台
      - 复杂拆解生产线控制
      - 移动端、小程序和 App
    initial_business_roles:
      - 回收操作员
      - 仓库管理员
      - 流转管理员
      - 综合利用人员
      - 业务主管
      - 系统管理员
      - 外部协作企业
    role_boundary: 外部协作企业作为企业间流转参与方，暂不设置独立公众角色。
    core_business_objects:
      - 企业
      - 用户、角色及权限
      - 动力电池或电池包
      - 回收批次
      - 验收记录
      - 入库、库存和出库记录
      - 流转单
      - 接收确认记录
      - 综合利用记录
      - 生命周期追溯事件
      - 异常记录
      - 操作审计记录
    external_interface_positioning: 首期只保留监管报送和外部系统接口的设计扩展能力，不进行真实平台连接；课程演示可以使用模拟报送或文件导出。
    document_requirement: 按课程“软件工程27项文档”逐阶段生成；现在只确定文档清单和对应阶段，不一次性生成全部文档；如果老师提供固定名称和模板，再按课堂要求调整。

constraints:
  minimum_documents: 12
  target_documents: 27
  source_repository_required: true
  database_required: true
  no_invented_business_rules: true
  no_code_before_required_gates: true

next_stage:
  stage: global-business-baseline
  gate: C2
  focus:
    - 业务参与者和职责
    - 端到端业务流程
    - 业务对象及其关系
    - 电池状态及状态转换
    - 业务规则与异常流程
    - 系统范围和人工边界
    - 术语表
    - 第一条纵向业务切片候选
  prohibited_until_later_gates:
    - 数据库设计
    - 页面设计
    - 前后端代码设计

c2_progress:
  current_step: C2-1 术语和业务事实盘点
  status: paused-for-review
  outputs:
    - docs/business/c2-1-business-facts-baseline.md
  completed_items:
    - 业务术语表 V0.1
    - 参与者及职责表 V0.1
    - 端到端业务主流程 V0.1
    - 业务事实基线表达 V0.1
    - C2-1 待确认问题清单
  not_started_items:
    - 核心业务对象及关系
    - 业务状态和状态转换
    - 业务规则与异常流程
    - 系统处理与人工处理边界
    - 第一条纵向业务切片选择
    - C2 检查和确认

open_questions:
  - id: Q-C2-001
    stage: C2
    question: 系统最小追踪单位是电池包、模组还是单体电芯？
    impact: 影响追踪对象、编号、状态机和后续需求。
    status: open
  - id: Q-C2-002
    stage: C2
    question: 电池唯一编号从哪里产生，是否通过二维码识别？
    impact: 影响接收、追溯、审计和演示方式。
    status: open
  - id: Q-C2-003
    stage: C2
    question: 回收接收时需要登记哪些来源信息？
    impact: 影响回收接收事实和追溯节点。
    status: open
  - id: Q-C2-004
    stage: C2
    question: 验收结果有哪些：通过、拒收、待处理，还是包含有条件接收？
    impact: 影响验收状态和异常路径。
    status: open
  - id: Q-C2-005
    stage: C2
    question: 入库前是否必须完成验收？
    impact: 影响入库条件和业务规则。
    status: open
  - id: Q-C2-006
    stage: C2
    question: 企业间流转由哪一方创建，哪一方确认接收？
    impact: 影响流转职责和协同边界。
    status: open
  - id: Q-C2-007
    stage: C2
    question: 对方拒收或实际数量不一致时如何处理？
    impact: 影响异常流程和追溯记录。
    status: open
  - id: Q-C2-008
    stage: C2
    question: 综合利用包括梯次利用、拆解、材料回收中的哪些环节？
    impact: 影响综合利用范围。
    status: open
  - id: Q-C2-009
    stage: C2
    question: 哪些操作必须由业务主管审核？
    impact: 影响职责、权限和业务规则。
    status: open
  - id: Q-C2-010
    stage: C2
    question: 哪些记录一旦生效就不能删除，只能撤销或更正？
    impact: 影响审计、追溯和更正规则。
    status: open
  - id: Q-C2-011
    stage: C2
    question: 合规报送首期采用报表导出还是模拟报送？
    impact: 影响合规报送定位和演示交付。
    status: open
  - id: Q-C2-012
    stage: C2
    question: 追溯查询需要展示哪些关键节点和责任主体？
    impact: 影响追溯事件口径和展示内容。
    status: open
