    version: V1.1
    status: confirmed
    review_result: 复核通过
    technical_design_v1_1_started: true
    implementation_branch_created: false
  resolved_questions:
    DG-Q-001: 系统管理员可以查看、启用和停用固定规则；不能修改规则算法或编写脚本；启停必须填写原因并审计。
    DG-Q-002: 业务主管分配问题；回收操作员和仓库管理员处理各自业务问题；业务主管重新检查并关闭；处理人不能自行关闭严重问题。
    DG-Q-003: V1.1 只支持手工发起质量检查；原业务实时校验继续保留，但不作为治理检查任务。
    DG-Q-004: DQ-001 至 DQ-007 进入第一版；DQ-008 临时附件规则延期。
    DG-Q-005: 已生效数据不得直接覆盖；必须通过业务更正或调整记录处理，并在质量问题中关联更正记录。
    DG-Q-006: 必须有整改证据、同一规则重新检查通过、业务主管复核和完整审计，问题才能关闭。
  v0_3_review_blockers_addressed:
    - DQ-001..DQ-007 已按 V1.0 SQL 和数据字典字段重新校对
    - V1.1 不实现问题豁免，豁免能力延期
    - 原型规则启停按企业保存，停用规则不参与检查
    - 原型列表、结果、详情、审计和看板按企业隔离
    - NFR 追踪矩阵已补充
    - REVIEW-DG-001..014 实际评审记录已补充

