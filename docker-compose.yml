services:
  mysql:
    image: mysql:8.4
    container_name: battery-traceability-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: battery_traceability
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
