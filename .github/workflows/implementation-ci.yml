name: Implementation CI

on:
  push:
    branches:
      - feature/first-slice-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: battery_traceability
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
      - name: Wait for MySQL 8.4
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1
      - name: Prepare test database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS battery_traceability_test;"
      - name: Build and test backend
        working-directory: backend
        env:
          RUN_MYSQL_TESTS: "true"
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: battery_traceability_test
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-development-secret-for-i1-tests-32bytes' }}
        run: mvn -B test
      - name: Run Flyway V1.0, V1.1, I1 and I2 migrations on MySQL 8.4
        working-directory: backend
        run: >
          mvn -B
          '-Dflyway.url=jdbc:mysql://127.0.0.1:3306/battery_traceability?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false'
          -Dflyway.user=root
          -Dflyway.password=root
          flyway:migrate
      - name: Verify migrated table and permission baseline
        run: |
          TABLE_COUNT=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='battery_traceability' AND table_type='BASE TABLE' AND table_name <> 'flyway_schema_history';")
          echo "business_table_count=${TABLE_COUNT}"
          if [ "${TABLE_COUNT}" != "29" ]; then
            mysql -h 127.0.0.1 -uroot -proot -e "SHOW TABLES FROM battery_traceability;"
            exit 1
          fi
          ROLE_COUNT=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT COUNT(*) FROM sys_role;")
          PERMISSION_COUNT=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT COUNT(*) FROM sys_permission;")
          TOGGLE_ASSIGNMENTS=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT COUNT(*) FROM sys_role_permission rp JOIN sys_permission p ON p.id = rp.permission_id WHERE p.permission_code = 'dq:rule:toggle';")
          IDEMPOTENCY_KEY_LENGTH=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT CHARACTER_MAXIMUM_LENGTH FROM information_schema.columns WHERE table_schema='battery_traceability' AND table_name='idempotency_record' AND column_name='idempotency_key';")
          ACTIVE_BATTERY_GUARD=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='battery_traceability' AND table_name='recycle_batch_battery' AND index_name='uk_rbb_active_battery';")
          SYSTEM_ADMIN_PERMS=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT GROUP_CONCAT(p.permission_code ORDER BY p.permission_code SEPARATOR ',') FROM sys_role r JOIN sys_role_permission rp ON rp.role_id = r.id JOIN sys_permission p ON p.id = rp.permission_id WHERE r.role_code = 'SYSTEM_ADMIN';")
          BUSINESS_SUPERVISOR_PERMS=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT GROUP_CONCAT(p.permission_code ORDER BY p.permission_code SEPARATOR ',') FROM sys_role r JOIN sys_role_permission rp ON rp.role_id = r.id JOIN sys_permission p ON p.id = rp.permission_id WHERE r.role_code = 'BUSINESS_SUPERVISOR';")
          RECYCLE_OPERATOR_PERMS=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT GROUP_CONCAT(p.permission_code ORDER BY p.permission_code SEPARATOR ',') FROM sys_role r JOIN sys_role_permission rp ON rp.role_id = r.id JOIN sys_permission p ON p.id = rp.permission_id WHERE r.role_code = 'RECYCLE_OPERATOR';")
          WAREHOUSE_ADMIN_PERMS=$(mysql -h 127.0.0.1 -uroot -proot -N -B battery_traceability -e "SELECT GROUP_CONCAT(p.permission_code ORDER BY p.permission_code SEPARATOR ',') FROM sys_role r JOIN sys_role_permission rp ON rp.role_id = r.id JOIN sys_permission p ON p.id = rp.permission_id WHERE r.role_code = 'WAREHOUSE_ADMIN';")
          echo "role_count=${ROLE_COUNT}"
          echo "permission_count=${PERMISSION_COUNT}"
          echo "dq_rule_toggle_assignments=${TOGGLE_ASSIGNMENTS}"
          echo "idempotency_key_length=${IDEMPOTENCY_KEY_LENGTH}"
          echo "active_battery_guard=${ACTIVE_BATTERY_GUARD}"
          echo "system_admin_permissions=${SYSTEM_ADMIN_PERMS}"
          echo "business_supervisor_permissions=${BUSINESS_SUPERVISOR_PERMS}"
          echo "recycle_operator_permissions=${RECYCLE_OPERATOR_PERMS}"
          echo "warehouse_admin_permissions=${WAREHOUSE_ADMIN_PERMS}"
          if [ "${ROLE_COUNT}" != "4" ] || [ "${PERMISSION_COUNT}" != "26" ] || [ "${TOGGLE_ASSIGNMENTS}" != "0" ] || [ "${IDEMPOTENCY_KEY_LENGTH}" != "128" ] || [ "${ACTIVE_BATTERY_GUARD}" != "1" ]; then
            exit 1
          fi
          if [ "${SYSTEM_ADMIN_PERMS}" != "audit:read,authenticated,dq:audit:read,dq:dashboard:read,dq:issue:read,dq:rule:read,permission:manage" ]; then exit 1; fi
          if [ "${BUSINESS_SUPERVISOR_PERMS}" != "attachment:read,authenticated,batch:read,dq:audit:read,dq:check:execute,dq:check:read,dq:dashboard:read,dq:issue:assign,dq:issue:read,dq:issue:recheck,dq:rule:read,inventory:read,trace:read" ]; then exit 1; fi
          if [ "${RECYCLE_OPERATOR_PERMS}" != "acceptance:create,acceptance:supplement,attachment:read,attachment:upload,authenticated,batch:create,batch:read,batch:submit,battery:create,battery:duplicate:resolve,dq:issue:process,dq:issue:read,trace:read" ]; then exit 1; fi
          if [ "${WAREHOUSE_ADMIN_PERMS}" != "attachment:read,attachment:upload,authenticated,batch:read,dq:issue:process,dq:issue:read,inbound:create,inventory:read,trace:read,warehouse:read" ]; then exit 1; fi
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW TABLES FROM battery_traceability;"
      - name: Verify Spring Boot connects to migrated database
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: battery_traceability
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-development-secret-for-i1-tests-32bytes' }}
        run: |
          mvn -B spring-boot:run > spring-boot.log 2>&1 &
          APP_PID=$!
          trap "kill ${APP_PID} 2>/dev/null || true" EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              cat spring-boot.log
              exit 1
            fi
            sleep 2
          done

          cat spring-boot.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate first-slice OpenAPI
        run: npx --yes @redocly/cli@2.54.3 lint contracts/api/openapi-first-slice.yaml
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production build has no demo password prefill
        working-directory: frontend
        run: |
          if grep -R "admin/password" dist; then
            exit 1
          fi
