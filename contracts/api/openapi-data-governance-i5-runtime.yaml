openapi: 3.0.3
info:
  title: Battery Recycling Traceability Data Quality Discovery API
  version: 1.1.0-i5
  description: I5 data quality discovery runtime contract. Remediation, dashboard, audit-query and workflow APIs are intentionally out of scope.
  license:
    name: Course Project Internal Use
    url: https://example.com/internal-course-project
servers:
  - url: /api/v1
security:
  - BearerAuth: []
tags:
  - name: DataQualityRules
    description: Fixed rule definitions and current enterprise enablement.
  - name: DataQualityChecks
    description: Synchronous manual check runs and per-rule results.
  - name: DataQualityIssues
    description: Open quality issue discovery and read-only details.
paths:
  /data-quality/rules:
    get:
      tags: [DataQualityRules]
      operationId: listDataQualityRules
      summary: List fixed data quality rules.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /data-quality/rules/{ruleCode}/status:
    patch:
      tags: [DataQualityRules]
      operationId: toggleDataQualityRuleStatus
      summary: Reject rule enablement changes in I5.
      parameters:
        - $ref: '#/components/parameters/RuleCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleRuleStatusRequest'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /data-quality/check-runs:
    post:
      tags: [DataQualityChecks]
      operationId: createDataQualityCheckRun
      summary: Create and execute a data quality check run.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckRunRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRunEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /data-quality/check-runs/{runId}:
    get:
      tags: [DataQualityChecks]
      operationId: getDataQualityCheckRun
      summary: Get a data quality check run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRunEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /data-quality/check-runs/{runId}/results:
    get:
      tags: [DataQualityChecks]
      operationId: listDataQualityCheckResults
      summary: List results for a data quality check run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResultListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /data-quality/issues:
    get:
      tags: [DataQualityIssues]
      operationId: listDataQualityIssues
      summary: List visible data quality issues.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IssueStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /data-quality/issues/{issueId}:
    get:
      tags: [DataQualityIssues]
      operationId: getDataQualityIssue
      summary: Get visible data quality issue details.
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RuleCode:
      name: ruleCode
      in: path
      required: true
      schema:
        type: string
        enum: [DQ-001, DQ-002, DQ-003, DQ-004, DQ-005, DQ-006, DQ-007]
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LongId'
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied or cross-enterprise access denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State conflict or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LongId:
      type: string
      pattern: '^[0-9]+$'
    ApiEnvelopeBase:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        traceId: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: true
          nullable: true
    EnabledStatus:
      type: string
      enum: [ENABLED, DISABLED]
    IssueStatus:
      type: string
      enum: [OPEN, ASSIGNED, PROCESSING, SUBMITTED, RECHECKING, REJECTED, CLOSED]
    Rule:
      type: object
      required: [id, ruleCode, ruleName, dimension, objectType, handlerCode, severity, defaultOwnerRoleCode, dataStandardMetadata, involvedFields, checkCondition, remediationGuidance, allowExemption, ruleStatus, enabledStatus]
      properties:
        id: { $ref: '#/components/schemas/LongId' }
        ruleCode: { type: string, enum: [DQ-001, DQ-002, DQ-003, DQ-004, DQ-005, DQ-006, DQ-007] }
        ruleName: { type: string }
        dimension: { type: string }
        objectType: { type: string }
        handlerCode: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        defaultOwnerRoleCode:
          type: string
          enum: [BUSINESS_SUPERVISOR, RECYCLE_OPERATOR, WAREHOUSE_ADMIN, SYSTEM_ADMIN]
        dataStandardMetadata: { type: object, additionalProperties: true }
        involvedFields:
          type: array
          items: { type: string }
        checkCondition: { type: string }
        remediationGuidance: { type: string }
        allowExemption: { type: boolean, enum: [false] }
        ruleStatus: { type: string, enum: [ACTIVE, RETIRED] }
        enabledStatus:
          $ref: '#/components/schemas/EnabledStatus'
    ToggleRuleStatusRequest:
      type: object
      required: [enabledStatus, reason]
      properties:
        enabledStatus:
          $ref: '#/components/schemas/EnabledStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 512
    CreateCheckRunRequest:
      type: object
      required: [runScope]
      properties:
        runScope:
          type: string
          enum: [ALL, BATTERY, INBOUND, INVENTORY, TRACE]
        requestedRuleCodes:
          type: array
          items:
            type: string
            enum: [DQ-001, DQ-002, DQ-003, DQ-004, DQ-005, DQ-006, DQ-007]
    CheckRun:
      type: object
      required: [id, enterpriseId, runNo, runScope, runStatus, requestedRuleCodes, executedRuleCodes, checkedObjectCount, checkedRuleCount, issueCount, resultSummary, startedBy, startedAt]
      properties:
        id: { $ref: '#/components/schemas/LongId' }
        enterpriseId: { $ref: '#/components/schemas/LongId' }
        runNo: { type: string }
        runScope: { type: string, enum: [ALL, BATTERY, INBOUND, INVENTORY, TRACE] }
        runStatus: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        requestedRuleCodes:
          type: array
          items: { type: string }
        executedRuleCodes:
          type: array
          items: { type: string }
        checkedObjectCount: { type: integer }
        checkedRuleCount: { type: integer }
        issueCount: { type: integer }
        resultSummary:
          type: object
          additionalProperties: true
        failureReason:
          type: string
          nullable: true
        startedBy: { $ref: '#/components/schemas/LongId' }
        startedAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true
    CheckResult:
      type: object
      required: [id, enterpriseId, runId, ruleCode, checkStatus, checkedObjectCount, violationCount, ruleSnapshot, startedAt]
      properties:
        id: { $ref: '#/components/schemas/LongId' }
        enterpriseId: { $ref: '#/components/schemas/LongId' }
        runId: { $ref: '#/components/schemas/LongId' }
        ruleCode: { type: string }
        checkStatus: { type: string, enum: [PASS, VIOLATION, SKIPPED, ERROR] }
        checkedObjectCount: { type: integer }
        violationCount: { type: integer }
        ruleSnapshot:
          type: object
          additionalProperties: true
        startedAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
    Issue:
      type: object
      required: [id, enterpriseId, issueNo, ruleCode, objectType, objectIdentity, objectKey, title, description, severity, ownerRoleCode, issueStatus, discoveredRunId, discoveredResultId, firstDetectedAt, lastDetectedAt]
      properties:
        id: { $ref: '#/components/schemas/LongId' }
        enterpriseId: { $ref: '#/components/schemas/LongId' }
        issueNo: { type: string }
        ruleCode: { type: string }
        objectType: { type: string }
        objectId:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        objectIdentity: { type: string }
        objectKey: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        ownerRoleCode:
          type: string
          enum: [BUSINESS_SUPERVISOR, RECYCLE_OPERATOR, WAREHOUSE_ADMIN, SYSTEM_ADMIN]
        issueStatus:
          $ref: '#/components/schemas/IssueStatus'
        assignedToUserId:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        discoveredRunId: { $ref: '#/components/schemas/LongId' }
        discoveredResultId: { $ref: '#/components/schemas/LongId' }
        firstDetectedAt: { type: string, format: date-time }
        lastDetectedAt: { type: string, format: date-time }
    RuleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Rule'
    CheckRunEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CheckRun'
    CheckResultListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CheckResult'
    IssueListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Issue'
    IssueEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Issue'
